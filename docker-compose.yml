# 栖间 · NestLedger —— 源码构建版（飞牛 NAS / 任意 Docker Compose 环境）
#
# ⚠️ 重要：本文件必须与下面这些文件放在【同一个目录】，否则会报
#    failed to read dockerfile: open Dockerfile: no such file or directory
#   Dockerfile  server/index.js  server/package.json  web/index.html  .env(可选)
#   不确定就先跑： bash scripts/predeploy.sh
#
# 用法：
#   bash scripts/predeploy.sh          # 先自检目录结构
#   docker compose up -d --build       # 首次，本地源码构建
#   docker compose up -d               # 之后，复用已构建镜像
#
# 若只想在飞牛图形界面粘贴一段 YAML、不想上传源码文件，
# 请改用 docker-compose.image.yml（纯 GHCR 镜像模式）。
#
# 注意：本文件刻意不写 image: 字段，避免 Compose 先去 Docker Hub 拉取
# 不存在的本地标签（表现为 nestledger Pulling + registry-1.docker.io 超时）。
services:
  nestledger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内 NAS 拉不到 Docker Hub 时，在 .env 里把 BASE_IMAGE 换成可用地址
        BASE_IMAGE: ${BASE_IMAGE:-node:22-alpine}
    container_name: nestledger
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${PORT:-8787}:8787"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      BACKUP_ON_WRITE: ${BACKUP_ON_WRITE:-1}
      MAX_BODY: ${MAX_BODY:-67108864}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
    volumes:
      # 所有业务数据、附件与自动快照都在这个目录，备份 / 迁移只需复制它
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
