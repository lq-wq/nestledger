<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栖间 · NestLedger · 房屋租赁台账</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314513A'/%3E%3Cpath d='M6 15 16 7l10 8M9 14v11h14V14' fill='none' stroke='%23C6A15B' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   栖间 · NestLedger  |  界面层：墨庭 · Quiet Estate
   设计语言移植自「悦租管家」：深绿 #14513A × 象牙白 #F4F7F5 × 香槟金 #C6A15B
   金色仅用于 logo / 细线 / 选中指示 / 关键强调，面积占比 < 5%
   夜间为重新校准的夜墨绿，非简单反色；正文对比度 ≥ 4.5:1
   零外部字体 / 图片 / 第三方依赖
   ============================================================ */
:root{
  /* ---- 浅色：象牙白底 + 深绿主色 ---- */
  --bg:#F4F7F5; --surface:#FFFFFF; --surface-2:#F8FAF9; --surface-3:#EFF4F0;
  --border:#E2EAE5; --border-strong:#CBD9D0; --border-soft:#EDF3EE; --hover:#F2F8F4;
  --text:#12261E; --sub:#4E6359; --muted:#8A9B91;
  --accent:#14513A; --accent-hover:#0E3A2A; --accent-soft:#E7F1EB; --accent-ink:#14513A;
  --accent-line:#C7DFD1; --on-accent:#FFFFFF;
  --ok:#16824F; --ok-bg:#E5F4EB; --ok-line:#BEE3CE;
  --warn:#A56A0B; --warn-bg:#FBF0DA; --warn-line:#EBD5A8; --warn-ink:#8A4700;
  --danger:#B4342C; --danger-bg:#FBE9E7; --danger-line:#EFC9C4; --danger-ink:#8E251E;
  --neutral-bg:#EEF2EF; --neutral-ink:#4E6359;
  /* ---- 香槟金：仅作点缀 ---- */
  --gold:#C6A15B; --gold-soft:#F3E9D3; --gold-line:rgba(198,161,91,.38);
  /* ---- 墨绿侧栏 ---- */
  --side:#0B2E21; --side-bg:#0B2E21; --side-line:rgba(255,255,255,.09);
  --side-text:rgba(255,255,255,.70); --side-muted:rgba(255,255,255,.54);
  --side-ink:#FFFFFF; --side-active:#1B6A4B;
  --radius:12px; --radius-card:14px; --radius-btn:8px; --radius-chip:999px;
  --shadow:0 1px 2px rgba(11,46,33,.04),0 6px 18px rgba(11,46,33,.06);
  --shadow-lg:0 18px 48px rgba(11,46,33,.18);
  --focus:rgba(20,81,58,.12); --mask:rgba(6,20,14,.55);
  --toast-bg:#0E3A2A; --toast-ink:#FFFFFF; --track:#E6EDE8;
  --font:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
}
html[data-theme="dark"]{
  /* ---- 夜间：夜墨绿重校准，亮绿主色，非反色 ---- */
  --bg:#08150F; --surface:#10231A; --surface-2:#142B20; --surface-3:#193326;
  --border:#234334; --border-strong:#315640; --border-soft:#1C3427; --hover:#183124;
  --text:#EAF3EC; --sub:#A9BFB0; --muted:#8CA795;
  --accent:#4FB98A; --accent-hover:#65CD9D; --accent-soft:#173B2A; --accent-ink:#6FD3A5;
  --accent-line:#2A5A41; --on-accent:#062015;
  --ok:#5FCB90; --ok-bg:#173A28; --ok-line:#28563C;
  --warn:#E3B457; --warn-bg:#3B2F15; --warn-line:#5A4322; --warn-ink:#F0C383;
  --danger:#F08B82; --danger-bg:#3A1E1B; --danger-line:#5D2A38; --danger-ink:#F5A0AF;
  --neutral-bg:#1B3025; --neutral-ink:#A9BFB0;
  --gold:#C6A15B; --gold-soft:#332A18; --gold-line:rgba(198,161,91,.45);
  --side:#06110C; --side-bg:#06110C; --side-line:rgba(255,255,255,.08);
  --side-text:rgba(255,255,255,.68); --side-muted:rgba(255,255,255,.52);
  --side-ink:#EAF3EC; --side-active:#1C6145;
  --shadow:0 1px 2px rgba(0,0,0,.28),0 6px 18px rgba(0,0,0,.34);
  --shadow-lg:0 18px 48px rgba(0,0,0,.55);
  --focus:rgba(79,185,138,.22); --mask:rgba(2,8,5,.72);
  --toast-bg:#1C6145; --toast-ink:#EAF3EC; --track:#1D3629;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:13.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
  transition:background-color .18s ease,color .18s ease;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
.app{display:flex;height:100vh;overflow:hidden}

/* ---------- Sidebar ---------- */
.sidebar{width:212px;flex:0 0 212px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--on-accent);flex:none}
.brand-mark svg{width:18px;height:18px}
.brand-txt strong{display:block;font-size:13.5px;font-weight:650;line-height:1.3}
.brand-txt span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
.nav{padding:2px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:10px;color:var(--muted);padding:13px 10px 6px;letter-spacing:.14em;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:7px 10px;margin:2px 0;border:0;background:transparent;border-radius:var(--radius-btn);color:var(--sub);text-align:left;font-size:12.5px;position:relative;transition:.15s}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.9}
.nav-item span{flex:1;min-width:0}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.nav-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item .cnt{margin-left:auto;flex:none;font-size:10.5px;background:var(--danger-bg);color:var(--danger);border-radius:var(--radius-chip);padding:1px 7px;font-weight:650}
.side-foot{padding:13px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);line-height:1.7}
.side-foot b{color:var(--sub);font-weight:650}
.sync-chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sub);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-btn);height:32px;padding:0 11px;white-space:nowrap;cursor:default}
.sync-chip .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync-chip.is-server{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.sync-chip.is-server .sync-dot{background:var(--ok)}
.sync-chip.is-warn{color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn-line)}
.sync-chip.is-warn .sync-dot{background:var(--warn)}
.sync-chip.is-error{color:var(--danger-ink);background:var(--danger-bg);border-color:var(--danger-line)}
.sync-chip.is-error .sync-dot{background:var(--danger)}
.sync-chip.is-local .sync-dot{background:var(--muted)}

/* ---------- Main / Topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{min-height:64px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:8px 24px;gap:14px}
.topbar h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.01em}
.topbar .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.top-actions{display:flex;align-items:center;gap:9px}
.date-chip{font-size:11.5px;color:var(--sub);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-btn);height:32px;display:flex;align-items:center;padding:0 11px;white-space:nowrap}
.theme-seg{display:inline-flex;gap:2px;background:var(--surface-3);border:1px solid var(--border);border-radius:9px;padding:3px;flex:none}
.theme-opt{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:0;background:transparent;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--sub);white-space:nowrap;transition:.15s}
.theme-opt svg{width:13px;height:13px}
.theme-opt:hover{color:var(--accent-ink)}
.theme-opt.is-active{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(20,32,56,.12)}
html[data-theme="dark"] .theme-opt.is-active{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent)}
.view{flex:1;overflow-y:auto;padding:22px 24px 40px}

/* ---------- Common ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-head h2{font-size:13.5px;font-weight:650;margin:0}
.card-head .hint{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:8px}
.card-body{padding:16px 18px}
.section{margin-bottom:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.page-lead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 16px}
.page-lead h3{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
.page-lead p{margin:3px 0 0;font-size:12.5px;color:var(--sub)}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:var(--radius-btn);font-size:12.5px;font-weight:600;white-space:nowrap;transition:.15s}
.btn:hover{background:var(--surface-3);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn-danger{color:var(--danger);border-color:var(--danger-line);background:var(--surface)}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn-sm{min-height:30px;padding:0 11px;font-size:11.5px;border-radius:7px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent-ink)}
.btn-ghost:hover{background:var(--accent-soft);border-color:transparent}
/* 行内小按钮降级为浅色，保证每屏只有一个实心主色按钮 */
.btn.btn-sm.btn-primary{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
.btn.btn-sm.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.link{color:var(--accent-ink);background:none;border:0;padding:2px 4px;font-size:12px;font-weight:600;border-radius:4px}
.link:hover{background:var(--accent-soft);text-decoration:underline}
.link.danger{color:var(--danger)}
.link.danger:hover{background:var(--danger-bg)}
.mini-btn{min-height:28px;padding:0 11px;font-size:11.5px;border-radius:7px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-ink);font-weight:650;white-space:nowrap}
.mini-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.icon-btn{width:26px;height:26px;min-width:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn:hover{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.icon-btn svg{width:14px;height:14px}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:14px}
.field-inline{display:flex;flex-direction:column;gap:4px}
.field-inline label{font-size:10.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-btn);background:var(--surface);outline:none;transition:.15s;font-size:12.5px
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:70px}
.search{position:relative;min-width:210px}
.search input{padding-left:32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
select{min-width:130px;cursor:pointer}
.filters input[type=text],.filters select{height:34px}
.spacer{flex:1}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;font-weight:600;color:var(--muted);background:var(--surface-2);padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:10.5px;letter-spacing:.04em}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;color:var(--sub)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.acts{white-space:nowrap;text-align:right}
.mono{font-variant-numeric:tabular-nums}
.strong{font-weight:650;color:var(--text)}
.sub-txt{color:var(--muted);font-size:11px}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty svg{width:30px;height:30px;opacity:.4;margin-bottom:10px}
.empty p{margin:0 0 14px;font-size:12.5px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--radius-chip);font-size:11.5px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-danger{background:var(--danger-bg);color:var(--danger)}
.b-info{background:var(--accent-soft);color:var(--accent-ink)}
.b-neutral{background:var(--neutral-bg);color:var(--neutral-ink)}

/* ---------- Metric strip ---------- */
.metric-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.metric{padding:16px 20px;border-right:1px solid var(--border);position:relative;min-width:0}
.metric:last-child{border-right:0}
.metric.danger{background:var(--danger-bg)}
.metric .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.metric.ok .bar{background:var(--ok)} .metric.warn .bar{background:var(--warn)} .metric.danger .bar{background:var(--danger)}
.metric .label{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:7px}
.metric .label svg{width:13px;height:13px;color:var(--muted)}
.metric .value{font-size:26px;font-weight:650;letter-spacing:-.03em;margin-top:7px;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .value small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.metric .foot{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.metric.danger .value{color:var(--danger)}
.sum-strip{display:flex;flex-wrap:wrap;gap:24px;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--sub)}
.sum-strip b{color:var(--text);font-size:14px;font-variant-numeric:tabular-nums;margin-left:5px}
.sum-strip .danger-txt b{color:var(--danger)}
.sum-strip .ok-txt b{color:var(--ok)}

/* ---------- 收租时间尺 ---------- */
.ruler{padding:18px 22px 16px}
.ruler-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ruler-top .t{font-size:12.5px;font-weight:650;color:var(--text)}
.ruler-top .lg{display:flex;gap:14px;font-size:11px;color:var(--sub)}
.ruler-top .lg i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.ruler-scroll{overflow-x:auto;padding-bottom:4px}
.ruler-line{position:relative;height:2px;background:var(--border);margin:0 8px;min-width:820px}
.ruler-days{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));margin-top:-9px;position:relative;min-width:820px}
.rday{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.rday .pt{width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong);position:relative;z-index:1}
/* 今天的蓝色定位环保留；节点圆点颜色由三档色阶决定，两者叠加不冲突 */
.rday.today .pt{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.rday.t-danger .pt{background:var(--danger);border-color:var(--danger)}
.rday.t-warn .pt{background:var(--warn);border-color:var(--warn)}
.rday.t-ok .pt{background:var(--ok);border-color:var(--ok)}
.rday .d{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rday.today .d{color:var(--accent-ink);font-weight:650}
.rday .ev{font-size:10px;color:var(--sub);white-space:nowrap;height:22px;line-height:22px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rday.t-danger .ev{color:var(--danger);font-weight:650}
.rday.t-warn .ev{color:var(--warn);font-weight:650}
.rday.t-ok .ev{color:var(--ok);font-weight:600}
.ruler-note{display:flex;align-items:center;gap:9px;margin-top:14px;padding:10px 12px;border-radius:var(--radius-btn);font-size:12px;font-weight:600;flex-wrap:wrap}
.ruler-note.danger{background:var(--danger-bg);color:var(--danger-ink)}
.ruler-note.info{background:var(--surface-3);color:var(--sub)}
.ruler-note svg{width:15px;height:15px;flex:none}
.ruler-note .btn,.ruler-note .mini-btn{margin-left:auto}
.ruler-empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:12.5px}
.ruler-empty svg{width:26px;height:26px;display:block;margin:0 auto 8px;opacity:.4}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.list-row:last-child{border-bottom:0}
.list-row .who{min-width:0;flex:1}
.list-row .who b{display:block;font-size:12.5px;font-weight:650;color:var(--text)}
.list-row .who span{font-size:11px;color:var(--muted)}
.list-row .amt{font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
.prog{height:7px;border-radius:var(--radius-chip);background:var(--surface-3);overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;border-radius:var(--radius-chip);background:var(--accent)}
.prop-line{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:6px 0;color:var(--sub)}
.prop-line b{color:var(--text);font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{font-weight:600}

/* ---------- 行内「⋯」菜单 ---------- */
td.acts.row-acts{position:relative}
.row-menu-btn{width:26px;height:26px;min-width:26px;vertical-align:middle;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0;margin-left:4px}
.row-menu-btn:hover,.row-menu-btn[aria-expanded="true"]{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.row-menu-btn svg{width:15px;height:15px}
/* 展开时挂到 body 并用文档坐标绝对定位，脱离表格 / 卡片的所有 overflow 裁剪 */
.row-menu{position:absolute;left:0;top:0;z-index:120;min-width:158px;max-height:420px;overflow-y:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;text-align:left}
.row-menu[hidden]{display:none}
.row-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);font-size:12px;text-align:left;white-space:nowrap}
.row-menu button svg{width:14px;height:14px;flex:none;opacity:.8}
.row-menu button:hover{background:var(--surface-3);color:var(--accent-ink)}
.row-menu button.danger{color:var(--danger)}
.row-menu button.danger:hover{background:var(--danger-bg)}
.row-menu .sep{height:1px;background:var(--border);margin:4px 6px}
.attach-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:var(--radius-chip);background:var(--accent-soft);color:var(--accent-ink);font-weight:650;border:0}
.attach-chip:hover{background:var(--accent-line)}
.attach-chip svg{width:12px;height:12px}

/* ---------- Modal ---------- */
.mask{position:fixed;inset:0;background:var(--mask);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 24px;z-index:100;overflow-y:auto;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:620px;animation:pop .18s ease;overflow:hidden}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:.7}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:15px;font-weight:650}
.x-btn{width:28px;height:28px;border:0;background:transparent;border-radius:7px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.x-btn:hover{background:var(--surface-3);color:var(--text)}
.x-btn svg{width:16px;height:16px}
.modal-body{padding:20px;max-height:64vh;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--border);background:var(--surface-2)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--sub);font-weight:600}
.fld label .req{color:var(--danger);margin-left:2px}
.fld .tip{font-size:11px;color:var(--muted);line-height:1.6}
.err{font-size:12px;color:var(--danger);margin-top:2px}
.form-note{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-ink);padding:10px 12px;border-radius:var(--radius-btn);font-size:12.5px;line-height:1.7;margin-bottom:16px}
.form-note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.detail-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.detail-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.detail-row .k{color:var(--muted);flex:none}
.detail-row .v{text-align:right;font-weight:600;word-break:break-all;color:var(--text)}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:9px;background:var(--toast-bg);color:var(--toast-ink);padding:11px 15px;border-radius:var(--radius-btn);box-shadow:var(--shadow-lg);font-size:12.5px;animation:slidein .2s ease;max-width:360px}
.toast.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.toast.err{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line)}
.toast svg{width:16px;height:16px;flex:none}
@keyframes slidein{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}

.tabs{display:flex;gap:3px;background:var(--surface-3);padding:3px;border-radius:9px;width:fit-content;margin-bottom:16px}
.tab{padding:6px 16px;min-height:30px;border:0;background:transparent;border-radius:7px;font-size:12.5px;color:var(--sub)}
.tab.active{background:var(--surface);color:var(--accent-ink);font-weight:650;box-shadow:0 1px 3px rgba(20,32,56,.1)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);padding:11px 14px;border-radius:var(--radius-btn);font-size:12.5px;line-height:1.6;margin-bottom:16px}
.notice svg{width:16px;height:16px;flex:none;margin-top:2px}
.notice.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}
.notice .notice-act{margin-left:auto;flex:none;align-self:center}
.notice .notice-act .btn{background:var(--surface);border-color:var(--border)}
.kv{font-size:12.5px;color:var(--sub);line-height:1.9}
.kv b{color:var(--text)}

/* ---------- 合同附件 ---------- */
.attach-drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px dashed var(--border-strong);border-radius:9px;padding:13px 14px;background:var(--surface-2)}
.attach-drop>svg{width:26px;height:26px;color:var(--accent-ink);flex:none}
.attach-drop .hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:2px}
.attach-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.attach-item{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.attach-thumb{height:92px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;overflow:hidden}
.attach-thumb img{width:100%;height:100%;object-fit:cover}
.attach-thumb .pdf{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--danger);font-size:11px;font-weight:600}
.attach-thumb .pdf svg{width:30px;height:30px}
.attach-meta{padding:9px 10px}
.attach-name{font-size:12.5px;font-weight:650;word-break:break-all;line-height:1.35}
.attach-sub{font-size:11px;color:var(--muted);margin-top:3px}
.attach-ops{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:2px;padding:5px 7px;border-top:1px solid var(--border)}
.attach-preview-mask{z-index:160}
.attach-preview-mask .modal{max-width:920px}
.attach-preview-mask .modal-foot a{text-decoration:none}
.attach-preview-body{background:var(--surface-3);border-radius:9px;padding:12px;text-align:center}
.attach-preview-body img{max-width:100%;max-height:58vh;object-fit:contain}
.attach-preview-body iframe{width:100%;height:58vh;border:0;background:var(--surface)}
.hr{height:1px;background:var(--border);margin:18px 0}
.setting-row{display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--border-soft)}
.setting-row:first-child{padding-top:0}
.setting-row:last-child{border-bottom:0;padding-bottom:0}
.setting-row .s-main{flex:1;min-width:0}
.setting-row .s-title{font-size:13px;font-weight:650}
.setting-row .s-desc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.setting-row .s-ctrl{flex:none;width:158px}
.setting-row .s-ctrl input,.setting-row .s-ctrl select{height:34px}
/* 下次交租时间色阶：红=逾期/今天/1–10 天，黄=11–15 天，绿=16 天以上，灰=无安排 */
.due-date{font-weight:650;font-variant-numeric:tabular-nums;color:var(--text)}
.due-date.danger{color:var(--danger)}
.due-date.warn{color:var(--warn)}
.due-date.ok{color:var(--ok)}
.due-date.neutral{color:var(--muted)}
.due-date.overdue{color:var(--danger)}
.due-date.soon{color:var(--warn)}
.due-date.today{color:var(--accent-ink)}
/* 色阶图例：三档固定规则，不随「提前提醒天数」变化 */
.tone-guide{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:11px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--sub)}
.tone-guide>b{color:var(--text);font-weight:650}
.tone-guide .tg{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.tone-guide .tg i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tone-guide .tg.danger{color:var(--danger)} .tone-guide .tg.danger i{background:var(--danger)}
.tone-guide .tg.warn{color:var(--warn)} .tone-guide .tg.warn i{background:var(--warn)}
.tone-guide .tg.ok{color:var(--ok)} .tone-guide .tg.ok i{background:var(--ok)}
.tone-guide .tg.neutral{color:var(--neutral-ink)} .tone-guide .tg.neutral i{background:var(--neutral-ink)}
.tone-guide .tg-note{color:var(--muted);font-weight:400}

@media(max-width:1080px){
  .g4,.metric-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric:nth-child(2){border-right:0}
  .metric:nth-child(-n+2){border-bottom:1px solid var(--border)}
  .two-col{grid-template-columns:1fr}
  .sidebar{width:180px;flex-basis:180px}
}
@media(max-width:720px){
  .app{flex-direction:column;height:auto;min-height:100vh}
  .sidebar{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:12px 16px}
  .nav{display:flex;overflow-x:auto;padding:0 10px 8px;gap:4px}
  .nav-label,.side-foot{display:none}
  .nav-item{width:auto;white-space:nowrap;margin:0}
  .nav-item.active::before{display:none}
  .topbar{padding:10px 14px;flex-wrap:wrap}
  .view{padding:16px}
  .g4,.g3,.g2,.metric-strip{grid-template-columns:1fr}
  .metric{border-right:0;border-bottom:1px solid var(--border)}
  .metric:last-child{border-bottom:0}
  .form-grid,.detail-list{grid-template-columns:1fr}
  .setting-row{flex-direction:column;align-items:stretch;gap:9px}
  .setting-row .s-ctrl{width:100%}
  .date-chip{display:none}
}
@media(max-width:600px){.attach-list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================================================
   悦租管家视觉层 · 移植覆盖
   布局骨架 / 墨绿侧栏 / 金色点缀 / 圆角与极轻阴影 / 细字距大标题
   ============================================================ */
.sidebar{background:var(--side-bg);border-right:1px solid var(--side-line)}
.brand{padding:20px 18px 18px;border-bottom:1px solid var(--side-line);margin-bottom:6px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#E3C88C);color:#0B2E21;box-shadow:0 2px 10px rgba(198,161,91,.28)}
.brand-txt strong{color:var(--side-ink);font-weight:600;letter-spacing:.10em;font-size:14px}
.brand-txt span{color:var(--gold);letter-spacing:.14em;font-size:10px}
.nav{padding:2px 12px}
.nav-label{color:var(--side-muted);letter-spacing:.18em;font-weight:600}
.nav-item{color:var(--side-text);border-radius:8px;min-height:38px}
.nav-item svg{opacity:.86}
.nav-item:hover{background:rgba(255,255,255,.07);color:var(--side-ink)}
.nav-item.active{background:var(--side-active);color:var(--side-ink);font-weight:600}
.nav-item.active::before{background:var(--gold);width:3px;top:8px;bottom:8px}
.nav-item .cnt{background:var(--danger-bg);color:var(--danger-ink)}
.side-foot{border-top:1px solid var(--side-line);color:var(--side-muted);padding:14px 18px}
.side-foot b{color:var(--side-ink)}
.side-foot code{color:var(--gold)}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.topbar h1{font-weight:600;letter-spacing:.03em}
.top-right{padding-right:48px}
.card,.metric-strip{border-radius:var(--radius-card);box-shadow:var(--shadow)}
.card-head{border-bottom:1px solid var(--border)}
.page-lead h3{font-weight:600;letter-spacing:.02em;font-size:20px}
.btn{border-radius:9px;font-weight:600}
.btn-primary{box-shadow:0 1px 2px rgba(11,46,33,.10)}
.btn-primary:hover{box-shadow:var(--shadow)}
.theme-seg{border-radius:10px}
.theme-opt.is-active{color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--gold),0 1px 3px rgba(11,46,33,.10)}
html[data-theme="dark"] .theme-opt.is-active{box-shadow:inset 0 0 0 1px var(--gold)}
.metric .bar{background:var(--gold)}
.tabs .tab.active{box-shadow:inset 0 0 0 1px var(--gold-line),0 1px 3px rgba(11,46,33,.08)}
.form-note{border-left:3px solid var(--gold)}
.rday.today .pt{box-shadow:0 0 0 4px rgba(198,161,91,.20)}
.toast{border:1px solid var(--gold-line)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 右上角悬浮主题切换 · 与顶栏分段控件构成双入口 */
.theme-fab{position:fixed;top:12px;right:20px;z-index:95;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--accent-ink);border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.theme-fab:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.theme-fab svg{width:17px;height:17px}
.theme-fab .fab-moon{display:block}
.theme-fab .fab-sun{display:none}
html[data-theme="dark"] .theme-fab .fab-moon{display:none}
html[data-theme="dark"] .theme-fab .fab-sun{display:block}

/* 批量删除 · 勾选列与操作条 */
.chk-col{width:38px!important;text-align:center!important;padding-left:10px!important;padding-right:4px!important}
.chk-col input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
tbody tr.is-picked>td{background:var(--accent-soft)}
.bulkbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;font-size:12.5px;color:var(--accent-ink)}
.bulkbar.show{display:flex}
.bulkbar b{font-size:14px;font-variant-numeric:tabular-nums}
.bulkbar .spacer{flex:1}
.bulkbar .btn{min-height:30px;padding:0 11px;font-size:11.5px;background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.bulkbar .btn:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--surface)}
.bulkbar .btn.bulk-danger{color:var(--danger-ink);border-color:var(--danger-line)}
.bulkbar .btn.bulk-danger:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-ink)}

@media(max-width:720px){
  .top-right{padding-right:0}
  .theme-fab{top:auto;bottom:18px;right:18px;width:44px;height:44px}
  .brand{padding:14px 16px}
}


/* ---- 版本与自动更新 ---- */
.ver-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-btn);background:var(--surface-2);color:var(--sub);font-size:11.5px;font-weight:650;letter-spacing:.02em;white-space:nowrap;cursor:pointer;font-family:inherit}
.ver-chip:hover{border-color:var(--accent);color:var(--accent)}
.ver-chip.has-update{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.ver-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;box-shadow:0 0 0 3px var(--danger-bg)}
.upd-hero{display:flex;align-items:center;gap:14px;padding:15px 17px;border:1px solid var(--border);border-radius:var(--radius-btn);background:var(--surface-2);margin-bottom:16px}
.upd-hero .upd-name{font-size:15px;font-weight:650;letter-spacing:.05em}
.upd-hero .upd-desc{font-size:11.5px;color:var(--muted);margin-top:3px}
.upd-hero .upd-ver{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.upd-grid{display:grid;grid-template-columns:98px 1fr;gap:9px 14px;font-size:12.5px;line-height:1.6;padding:2px 0 4px}
.upd-grid>div:nth-child(odd){color:var(--muted)}
.upd-grid>div:nth-child(even){color:var(--ink);word-break:break-all}
.upd-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:16px}
.upd-note{font-size:11.5px;line-height:1.75;color:var(--muted);margin-top:14px}
.upd-note code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:11px}
@media(max-width:760px){.upd-grid{grid-template-columns:82px 1fr}}
</style>
</head>

      <div class="brand-txt"><strong>栖间</strong><span>NestLedger · 房屋租赁台账</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"><b>正在检测存储…</b><br>请稍候。</div>

  <div class="main">

        <span class="sync-chip" id="syncChip" title="正在检测数据存储"><i class="sync-dot"></i><span id="syncChipText">正在检测存储…</span></span>

          <button type="button" class="theme-opt" id="themeDark" data-act="set-theme" data-theme="dark" aria-pressed="false" title="夜间主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>夜间</button>

  <svg class="fab-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="fab-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<script>
/* ============================================================
   栖间 · NestLedger  |  房屋租赁与收租台账
   · 单文件模式（file://）：数据存 localStorage，零网络请求
   · NAS 模式（http://）：数据存服务端 data/db.json，localStorage 仅作离线缓存
   界面无任何外部字体 / 图片 / 第三方依赖
   ============================================================ */
'use strict';

var APP_NAME = '栖间';
var APP_NAME_EN = 'NestLedger';
var STORE_KEY = 'rental_manager_db_v1';
var APP_VERSION='1.3.1';  /* 由 scripts/sync-version.mjs 维护 */
/* 界面主题偏好单独存放：不进入业务数据 db，也不写入 JSON 备份 */
var THEME_KEY = 'rental_manager_theme_v1';
var currentTheme = 'light';
function readTheme(){
  try{ var v=localStorage.getItem(THEME_KEY); if(v==='dark'||v==='light') return v; }catch(e){}
  /* 首次访问跟随系统偏好，之后以用户显式选择为准 */
  try{ if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark'; }catch(e){}
  return 'light';

function applyTheme(t){

/* 按「收租时间 + N 个自然月」顺延：保持日号，遇小月自动取该月最后一天（1/31 +1月 = 2/28） */

  var lastDay=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  return first.getFullYear()+'-'+pad(first.getMonth()+1)+'-'+pad(Math.min(d,lastDay));

/* ---------------- 存储 ---------------- */
function emptyDB(){
  return { version:5, properties:[], rooms:[], tenants:[], contracts:[], bills:[], txns:[],
    settings:{reminderEnabled:DEFAULT_SETTINGS.reminderEnabled,reminderDays:DEFAULT_SETTINGS.reminderDays,browserNotify:DEFAULT_SETTINGS.browserNotify},
    meta:{demo:false, createdAt:today()} };
}
function validateDB(d){
  if(!d || typeof d!=='object') throw new Error('文件内容不是有效的数据对象');
  ['properties','rooms','tenants','contracts','bills','txns'].forEach(function(k){
    if(!Array.isArray(d[k])) throw new Error('缺少数据字段：'+k);
  });
  return d;
}
/* 兼容旧版备份：补齐提醒设置，且不改动任何既有业务数据 */
function normalizeSettings(d){
  if(!d.settings || typeof d.settings!=='object') d.settings={};
  var s=d.settings;
  if(typeof s.reminderEnabled!=='boolean') s.reminderEnabled=DEFAULT_SETTINGS.reminderEnabled;
  var n=Math.round(num(s.reminderDays));
  if(!n || n<1) n=DEFAULT_SETTINGS.reminderDays;
  s.reminderDays=Math.min(Math.max(n,1),60);
  if(typeof s.browserNotify!=='boolean') s.browserNotify=DEFAULT_SETTINGS.browserNotify;
  return d;
}
/* 兼容旧版备份：把「每期收租日（1–28 号）」换算成完整的「收租时间」，旧字段原样保留 */
function normalizeContracts(d){
  var bills=Array.isArray(d.bills)?d.bills:[];
  d.contracts.forEach(function(c){
    if(!c || typeof c!=='object') return;
    // 附件只接受三种白名单 MIME，且 dataURL 前缀必须与类型一致，防止备份文件被塞入其他类型
    var atts=Array.isArray(c.attachments)?c.attachments:[];
    c.attachments=atts.filter(function(a){
      return a && typeof a==='object' && ATTACH_TYPES[a.type] && typeof a.data==='string' &&
        a.data.indexOf('data:'+a.type+';base64,')===0;
    }).map(function(a){
      return {id:a.id||uid(),name:String(a.name||'合同附件'),type:a.type,
        size:num(a.size),data:a.data,uploadedAt:a.uploadedAt||today()};
    });
    if(c.rentSettled!=='已收讫' && c.rentSettled!=='待收'){
      // 旧版合同补状态：已有账单的保持「待收」（账单结构不变）；
      // 一张账单都没有的，说明本次租金在签约时已收妥，视为「已收讫」，
      // 下次交租时间直接显示「本次收租时间 + 付款周期」，与合同表单预览一致。
      c.rentSettled = bills.some(function(b){return b.contractId===c.id;}) ? '待收' : '已收讫';
    }
    if(!isDateStr(c.rentDate)){
      var start=isDateStr(c.startDate)?c.startDate:today();
      var day=Math.round(num(c.rentDueDay));
      c.rentDate=(day>=1 && day<=28) ? monthDate(start.slice(0,7),day) : start;
    }
  });
  return d;
}

/* ---------------- NAS 同步 · 渐进增强 ----------------
   file:// 双击、或普通静态服务器：完全走 localStorage，与旧版行为一致，零网络请求。
   NestLedger 服务端：所有写入同步到 /data/db.json；浏览器缓存仅用于离线兜底。
   多设备：切回页面 / 每 20 秒拉取一次新版本；同时编辑时以最后一次保存为准。
   ---------------------------------------------------- */
var sync = {
  mode:'local',          // 'file' | 'local' | 'server'
  rev:0, updatedAt:null, dirty:false, busy:false, connecting:false,
  timer:null, poll:null, lastError:''
};
function fetchJSON(url,opt,timeout){
  opt=opt||{};
  if(typeof fetch!=='function') return Promise.reject(new Error('当前浏览器不支持 fetch'));
  if(typeof AbortController!=='function'){
    return fetch(url,opt).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
  }
  var ctl=new AbortController(); opt.signal=ctl.signal;
  var timer=setTimeout(function(){ try{ctl.abort();}catch(e){} },timeout||5000);
  var ok=function(r){ clearTimeout(timer); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); };
  var fail=function(e){ clearTimeout(timer); throw e; };
  return fetch(url,opt).then(ok,fail);
}
function setSyncChip(kind,text,title){
  var chip=document.getElementById('syncChip'); if(!chip) return;
  chip.className='sync-chip'+(kind?' is-'+kind:'');
  chip.setAttribute('title',title||text||'');
  var t=document.getElementById('syncChipText'); if(t) t.textContent=text||'';
}
function setSideFoot(){
  var el=document.getElementById('sideFoot'); if(!el) return;
  if(sync.mode==='server'){
    el.innerHTML='<b>NAS 存储已启用</b><br>数据保存在服务器 <code>data/db.json</code>，每次写入自动留下快照；多设备访问同一地址即可共用一份数据。';
  }else if(sync.mode==='file'){
    el.innerHTML='<b>单文件本地模式</b><br>数据仅保存在当前浏览器，不产生任何网络请求。请定期在「数据备份」导出 JSON。';
  }else{
    el.innerHTML='<b>浏览器本地模式</b><br>未检测到 NestLedger 同步服务，数据仅保存在当前浏览器。请定期在「数据备份」导出 JSON。';
  }
}
function storageTarget(){ return sync.mode==='server' ? 'NAS 的数据目录' : '浏览器本地'; }
function storagePhrase(){ return sync.mode==='server' ? '数据保存在 NAS 的 data/db.json，多设备共用同一份。' : '数据仅保存在本机浏览器，请定期导出 JSON 备份。'; }
function storageDetail(){ return sync.mode==='server'
  ? 'NAS 上的 <code>data/db.json</code>（权威副本）；浏览器 localStorage（键名 '+esc(STORE_KEY)+'）仅作离线缓存'
  : '当前浏览器的 localStorage（键名 '+esc(STORE_KEY)+'）'; }
function storageAdvice(){ return sync.mode==='server'
  ? '建议定期把 NAS 的 data 目录再备份到另一块硬盘或网盘；历史快照可在上方直接下载还原。'
  : '数据不上传、不联网；清理浏览器数据、更换浏览器都可能导致数据不可见，请以导出的 JSON 文件为准。'; }
function adoptDB(d,rev,updatedAt){
  try{
    db=normalizeContracts(normalizeSettings(validateDB(d)));
    if(!db.meta) db.meta={demo:false,createdAt:today()};
  }catch(e){ return false; }
  sync.rev=Number(rev)||0; sync.updatedAt=updatedAt||null;
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(db)); }catch(e){}
  render();
  return true;
}
function pushDB(){
  if(sync.mode!=='server' || !sync.dirty || sync.busy) return;
  sync.busy=true;
  var payload;
  try{ payload=JSON.stringify({db:db,baseRev:sync.rev}); }
  catch(e){ sync.busy=false; return; }
  setSyncChip('warn','正在同步…','正在把数据写入 NAS');
  fetchJSON('api/db',{method:'PUT',headers:{'Content-Type':'application/json'},body:payload},12000)
  .then(function(r){
    sync.busy=false; sync.dirty=false; sync.lastError='';
    sync.rev=Number(r.rev)||sync.rev+1; sync.updatedAt=r.updatedAt||null;
    setSyncChip('server','已保存到 NAS','最后保存：'+(sync.updatedAt||'刚刚'));
  },function(e){
    sync.busy=false; sync.lastError=e.message||'网络错误';
    setSyncChip('error','待同步（离线）','写入失败：'+sync.lastError+'；数据已暂存本机，恢复连接后会自动重试');
  });
}
function schedulePush(){
  if(sync.mode!=='server') return;
  sync.dirty=true;
  setSyncChip('warn','待同步','数据将在 0.4 秒后写入 NAS');
  clearTimeout(sync.timer);
  sync.timer=setTimeout(pushDB,400);
}
function pullFromServer(){
  if(sync.mode!=='server' || sync.busy || sync.dirty) return;
  fetchJSON('api/meta',{cache:'no-store'},4000).then(function(m){
    if(Number(m.rev)<=sync.rev) return null;
    return fetchJSON('api/db',{cache:'no-store'},8000).then(function(r){
      if(r && r.hasData && adoptDB(r.db,r.rev,r.updatedAt)){
        setSyncChip('server','已保存到 NAS','已拉取其他设备的最新数据');
        toast('已同步其他设备的最新数据','ok');
      }
    });
  }).catch(function(){ /* 离线时保留当前数据，不打断操作 */ });
}
function connectSync(){
  if(sync.connecting || sync.mode==='server') return;
  sync.connecting=true;
  fetchJSON('api/meta',{cache:'no-store'},3000).then(function(m){
    sync.mode='server'; sync.rev=Number(m.rev)||0; setSideFoot();
    return fetchJSON('api/db',{cache:'no-store'},8000);
  }).then(function(r){
    sync.connecting=false;
    if(!r) return;
    if(r.hasData && adoptDB(r.db,r.rev,r.updatedAt)){
      setSyncChip('server','已保存到 NAS','数据来源：NAS 上的 data/db.json');
    }else{
      // 服务端首次启动：把浏览器里已有数据（或示例数据）迁移到 NAS
      sync.rev=0; sync.dirty=true; pushDB();
    }
  }).catch(function(e){
    sync.connecting=false;
    if(sync.mode==='server'){
      setSyncChip('error','连接异常','读取 NAS 数据失败：'+(e.message||'')+'，稍后将自动重试');
      return;
    }
    sync.mode='local'; setSideFoot();
    setSyncChip('local','本机浏览器存储','未检测到同步服务，数据仅保存在当前浏览器');
  });
}
function initSync(){
  if(typeof fetch!=='function' || location.protocol==='file:' || /^https?:$/.test(location.protocol)===false){
    sync.mode=(location.protocol==='file:')?'file':'local';
    setSyncChip('local','本机浏览器存储','单文件模式：数据不联网，请定期导出 JSON 备份');
    setSideFoot(); return;
  }
  setSyncChip('','正在检测存储…','正在连接 NestLedger 同步服务');
  connectSync();
  sync.poll=setInterval(function(){
    if(sync.mode==='server'){
      pullFromServer();
      if(sync.dirty && !sync.busy) pushDB();
    }else connectSync();   // 服务稍后才启动时自动接管
  },20000);
  document.addEventListener('visibilitychange',function(){
    if(sync.mode!=='server') return;
    if(document.visibilityState==='visible') pullFromServer();
    else if(sync.dirty && sync.timer){ clearTimeout(sync.timer); pushDB(); }
  });
  if(window.addEventListener){
    window.addEventListener('focus',function(){ pullFromServer(); });
    window.addEventListener('online',function(){ if(sync.dirty) pushDB(); });
  }
}

/* ---------------- 业务计算 ---------------- */
var CYCLE = {'月付':1,'季付':3,'半年付':6,'年付':12};
function cycleMonths(c){ return CYCLE[c.payCycle] || 1; }
/* 合同的「本次收租时间」：新数据是完整日期；旧数据由「每期收租日」+起租日换算，再旧则沿用起租日 */
function rentDateOf(c){
  if(c && isDateStr(c.rentDate)) return c.rentDate;
  if(c && isDateStr(c.startDate)){
    var day=Math.round(num(c.rentDueDay));
    if(day>=1 && day<=28) return monthDate(c.startDate.slice(0,7),day);
    return c.startDate;
  }
  return today();
}
/* 第 k 期的收租时间（k 从 0 起）= 本次收租时间 + k × 付款周期月数 */
function rentDateAt(c,k){ return addRentMonths(rentDateOf(c), k*cycleMonths(c)); }
/* 「本次收租时间」那笔租金已收讫时，第 0 期不再生成待收账单，系统从下一期（k=1）开始。
   旧合同没有该字段，一律按「待收」处理，保持原有账单与提醒不变。 */
function firstBillIndex(c){ return (c && c.rentSettled==='已收讫') ? 1 : 0; }
/* 「本次收租时间」对应的首期账期起始月。
   账期与收租时间必须共用同一套期次编号，否则「本次收租时间」是很多期之后的
   当前应收日时，收租时间会被整体平移（例：账期 2026-09 配 2029-02 的收租日）。
   - 新签合同：收租日落在起租月所在周期内，首期账期 = 起租月，保持原有习惯。
   - 存量合同：本次收租时间已跨过至少一期，收的是紧接着的下一个付款周期，
     账期直接从收租日次月开始，不再按起租月网格推算，避免年付 / 半年付把账期推偏。 */
function billStartMonth(c){
  var span=cycleMonths(c);
  var startM=String((c&&c.startDate)||'').slice(0,7);
  var rentM=rentDateOf(c).slice(0,7);
  if(!/^\d{4}-\d{2}$/.test(startM)) return /^\d{4}-\d{2}$/.test(rentM)?rentM:'';
  if(!/^\d{4}-\d{2}$/.test(rentM)) return startM;
  var diff=monthIndex(rentM)-monthIndex(startM);
  if(diff<span) return startM;                       // 起租当期收租：沿用起租月
  return addMonths(rentM,1);                         // 本次收租对应紧接着的下一个周期
}
/* 下一期交租时间 = 本次收租时间 + 一个付款周期（月付1/季付3/半年付6/年付12 个月） */
function nextRentDateFrom(dateStr,c){ return addRentMonths(dateStr, cycleMonths(c)); }
/* 某期账单之后的下一次交租时间。
   默认按「合同收租时间 + 期数 × 付款周期」从基准推算，避免 1/31→4/30→7/30 这种逐期漂移；
   若账单收租时间被人工改过，则尊重改动，以该日期为准顺延一期。 */
function nextDueAfterBill(c,b){
  if(!c || !b) return '';
  var span=cycleMonths(c), startM=billStartMonth(c);
  var period=String(b.period||'');
  if(!/^\d{4}-\d{2}$/.test(startM) || !/^\d{4}-\d{2}$/.test(period)) return nextRentDateFrom(b.dueDate,c);
  var diff=monthIndex(period)-monthIndex(startM), k=diff/span;
  if(diff>=0 && k===Math.floor(k) && isDateStr(b.dueDate) && b.dueDate===rentDateAt(c,k))
    return rentDateAt(c,k+1);
  return nextRentDateFrom(b.dueDate,c);
}
/* 下次交租时间：有未结清账单取最早一笔的收租时间；全部结清则按付款方式顺延到下一期 */
function nextRentInfo(c){
  if(!c || c.status==='已退租') return null;
  var bills=db.bills.filter(function(b){return b.contractId===c.id;});
  var unpaid=bills.filter(function(b){return billStatus(b)!=='已收';})
    .sort(function(a,b){return a.dueDate<b.dueDate?-1:(a.dueDate>b.dueDate?1:0);});
  var span=cycleMonths(c), lead=leadDays();
  var info={contractId:c.id,roomId:c.roomId,tenantId:c.tenantId,date:'',period:'',
    amount:round2(num(c.monthlyRent)*span),days:null,level:'normal',text:'',billId:'',needBill:false};
  if(unpaid.length){
    var b=unpaid[0];
    info.date=b.dueDate; info.period=periodLabel(b); info.billId=b.id;
    info.amount=round2(num(b.amount)-num(b.paidAmount));
  }else{
    var last=null;
    bills.forEach(function(x){ if(!last || x.period>last.period) last=x; });
    var startM=billStartMonth(c);
    var endM=String(c.endDate||'').slice(0,7);
    var first=firstBillIndex(c), nextK=first;
    if(last){
      var diff=monthIndex(String(last.period).slice(0,7))-monthIndex(startM);
      if(diff>=0 && diff%span===0) nextK=diff/span+1;
    }
    var nextPeriod=addMonths(startM,nextK*span);
    if(endM && nextPeriod>endM){
      info.level='none'; info.text='合同期内账单已结清'; info.period='—';
      return info;
    }
    // 无账单时按「本次收租时间 + 付款周期」推算（本次已收讫），或显示本次待收日期；
    // 有账单时按同一基准推算下一期，避免月末逐期漂移。两处与账单生成规则完全一致。
    info.date = last ? (nextDueAfterBill(c,last) || rentDateAt(c,nextK)) : rentDateAt(c,first);
    info.period=span>1?nextPeriod+' ~ '+addMonths(nextPeriod,span-1):nextPeriod;
    info.needBill=true;
  }
  var d=daysUntil(info.date);
  info.days=d;
  if(d===null){ info.level='normal'; info.text='—'; }
  else if(d<0){ info.level='overdue'; info.text='逾期 '+(-d)+' 天'; }
  else if(d===0){ info.level='today'; info.text='今天应收'; }
  else if(d<=lead){ info.level='soon'; info.text=d+' 天后应收'; }
  else { info.level='normal'; info.text=d+' 天后'; }
  if(info.needBill) info.text+=' · 待生成账单';
  return info;
}
function reminderList(){
  return db.contracts.filter(function(c){return c.status==='生效中'||c.status==='已到期';})
    .map(nextRentInfo)
    .filter(function(i){return i && i.level!=='none';})
    .sort(function(a,b){
      var da=(a.days==null?9999:a.days), dbb=(b.days==null?9999:b.days);
      return da-dbb;
    });
}
function reminderStats(){
  var list=reminderList();
  function pick(fn){ return list.filter(fn); }
  return {
    list:list,
    overdue:pick(function(i){return i.level==='overdue';}),
    today:pick(function(i){return i.level==='today';}),
    soon:pick(function(i){return i.level==='soon';}),
    needBill:pick(function(i){return i.needBill;}),
    attention:pick(function(i){return i.level==='overdue'||i.level==='today'||i.level==='soon';}),
    toneDanger:pick(function(i){return dueTone(i)==='danger';}),
    toneWarn:pick(function(i){return dueTone(i)==='warn';}),
    toneOk:pick(function(i){return dueTone(i)==='ok';}),
    total:sum(list,function(i){return i.amount;})
  };
}
/* 交租时间色阶（固定规则，不受「提前提醒天数」设置影响）：
   逾期 / 今天 / 1–10 天 → 红；11–15 天 → 黄；16 天及以上 → 绿；无明确交租日期 → 灰。
   逾期比「还有 1 天」更紧急，故与 1–10 天同属红色，不会被误判为安全的绿色。 */
var DUE_RED_MAX=10, DUE_AMBER_MAX=15;
function dueTone(info){
  if(!info) return 'neutral';
  if(info.tone) return info.tone;                 // 时间尺里「更早逾期」等汇总节点
  if(!info.date || info.days===null || info.days===undefined) return 'neutral';
  var d=info.days;
  if(d<=DUE_RED_MAX) return 'danger';
  if(d<=DUE_AMBER_MAX) return 'warn';
  return 'ok';
}
function toneGuideHTML(){
  return '<div class="tone-guide"><b>时间颜色</b>'+
    '<span class="tg danger"><i></i>逾期 / 今天 / 1–10 天 · 红</span>'+
    '<span class="tg warn"><i></i>11–15 天 · 黄</span>'+
    '<span class="tg ok"><i></i>16 天及以上 · 绿</span>'+
    '<span class="tg neutral"><i></i>合同期内已结清 · 灰</span>'+
    '<span class="tg-note">按距下次交租的天数固定分级，不受「提前提醒天数」影响。</span></div>';
}
function dueBadge(info){
  var cls={danger:'b-danger',warn:'b-warn',ok:'b-ok',neutral:'b-neutral'}[dueTone(info)]||'b-neutral';
  return '<span class="badge '+cls+'">'+esc(info.text)+'</span>';
}
function dueDateCell(info){
  if(!info || !info.date) return '<span class="sub-txt">—</span>';
  return '<span class="due-date '+dueTone(info)+'">'+esc(info.date)+'</span>';

function billStatus(b){
  if(round2(b.paidAmount) >= num(b.amount)) return '已收';
  if(num(b.paidAmount) > 0) return '部分';
  return (b.dueDate < today()) ? '逾期' : '未收';
}
function refreshBillStatuses(){ db.bills.forEach(function(b){ b.status=billStatus(b); }); }
function activeContractOf(roomId){

    var c=db.contracts[i];
    if(c.roomId===roomId && c.status==='生效中') return c;

function normalize(){
  // 生效中的合同若已过结束日期，自动标记为已到期
  db.contracts.forEach(function(c){

/* v1.2.1：识别旧版「账期与收租时间错位」的自动账单。
   旧版把「本次收租时间」当第 0 期，账期却从起租月起算，会出现
   账期 2026-09 却配 2029-02 的收租日。只标记未结清、未登记收款、无备注，
   且收租月份比账期结束月晚一个付款周期以上的账单；
   已收 / 部分收款 / 手工编辑过备注的账单一律保留。 */
function misalignedBillIds(d, onlyContractId){
  var ids={};
  (d.bills||[]).forEach(function(b){
    if(onlyContractId && b.contractId!==onlyContractId) return;
    var c=byId(d.contracts||[],b.contractId);
    if(!c) return;
    if(billStatus(b)==='已收' || num(b.paidAmount)>0 || (b.note&&String(b.note).trim())) return;
    if(!/^\d{4}-\d{2}$/.test(String(b.periodEnd||'')) || !isDateStr(b.dueDate)) return;
    if(monthIndex(b.dueDate.slice(0,7))-monthIndex(b.periodEnd)>cycleMonths(c)) ids[b.id]=1;
  });
  return ids;
}
function removeMisalignedBills(d, onlyContractId){
  var ids=misalignedBillIds(d,onlyContractId);
  var before=d.bills.length;
  d.bills=d.bills.filter(function(b){ return !ids[b.id]; });
  return before-d.bills.length;
}
function makeBillsFor(d, throughMonth){
  var created=0;
  d.contracts.forEach(function(c){
    if(c.status!=='生效中' && c.status!=='已到期') return;
    var span=cycleMonths(c), k=firstBillIndex(c);
    var baseM=billStartMonth(c);           // 账期与收租时间共用的期次基准
    var endM=String(c.endDate||'').slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(baseM)) return;
    // 起始期必须至少生成一笔：即使「生成至账期」选在当月，或本次租金已收讫而从 k=1 起算，
    // 也不能因为 through 太小而一笔都不生成（否则删空账单后会「提示生成却看不到」）。
    var firstPeriod=addMonths(baseM,k*span);
    var through=throughMonth<firstPeriod?firstPeriod:throughMonth;
    while(k<240){
      var period=addMonths(baseM,k*span);  // 期首月：从本次收租时间对应期开始推进
      if(period>through || (endM && period>endM)) break;
      var due=rentDateAt(c,k);             // 第 k 期收租时间 = 本次收租时间 + k×周期
      var exists=false;
      for(var i=0;i<d.bills.length;i++){ if(d.bills[i].contractId===c.id && d.bills[i].period===period){ exists=true; break; } }
      if(!exists){
        d.bills.push({
          id:uid(), contractId:c.id, roomId:c.roomId, tenantId:c.tenantId,
          period:period, periodEnd:addMonths(period,span-1), amount:round2(num(c.monthlyRent)*span),
          dueDate:due, paidAmount:0, paidDate:'', status:'未收',
          note:'', createdAt:today()
        });
        created++;
      }
      k++;
    }
  });
  return created;
}
/* v1.2.2：生成账单后无条件回到账单页，并清除残留筛选 / 勾选。
   旧行为下，若此前按月份、状态或关键词筛选过（尤其删空账单后该月份已从下拉里消失，
   下拉显示「全部月份」而内部筛选值仍在），新生成的账单会被静默过滤掉，

/* 月份下拉是动态生成的：账单被删除后，原先选中的月份可能已不在选项里，

     !monthOptions().some(function(o){return o.value===f.month;})) f.month='all';

function doBulk(key,op){

  var blocked=[];

    var n=db.rooms.filter(function(r){return r.propertyId===id;}).length;
    if(n) blocked.push('所选房源下还有房间');
  });
  if(key==='room') ids.forEach(function(id){
    var n=db.contracts.filter(function(c){return c.roomId===id;}).length;
    var b=db.bills.filter(function(x){return x.roomId===id;}).length;
    if(n||b) blocked.push('所选房间已有合同或账单');
  });
  if(key==='tenant') ids.forEach(function(id){
    var n=db.contracts.filter(function(c){return c.tenantId===id;}).length;
    if(n) blocked.push('所选租客名下还有生效合同');
  });
  if(blocked.length){ toast(blocked[0]+'，为保护数据未执行删除','err'); return; }
  var label=BULK_LABEL[key]||'记录';
  var extra=(key==='bill')?'<br>已登记的财务流水不会被删除。':(key==='contract')?'<br>关联账单会保留，但将失去合同关联。':'';
  confirmBox('批量删除','确定删除选中的 <b>'+ids.length+'</b> 条'+label+'吗？'+extra+'<br><br>此操作<b>不可撤销</b>，建议先导出备份。',function(){
    db[BULK_TABLE[key]]=db[BULK_TABLE[key]].filter(function(x){return ids.indexOf(x.id)<0;});
    if(key==='contract') db.rooms.forEach(function(r){ if(r.status==='已租' && !activeContractOf(r.id)) r.status='空置'; });
    state.sel[key]=[]; save(); modalClose(); render(); toast('已删除 '+ids.length+' 条'+label,'ok');

/* 「本月」统计口径（v1.3.1）：
   账单按【本期收租时间】所在月归月。v1.2.1 起账期从收租日次月起算，
   再用「账期覆盖当月」会把真正该收的月份整笔漏掉；季付 / 半年付账单也会在
   账期覆盖的每个月重复计一次全额。仅当历史账单缺收租时间时才回退为账期覆盖当月。
   收支流水按【流水日期】所在月统计，收款登记会自动生成收入流水。 */
function monthBillStats(d,cm){
  var list=(d.bills||[]).filter(function(b){
    var dm=String(b.dueDate||'').slice(0,7);
    return dm ? dm===cm : (b.period<=cm && b.periodEnd>=cm);
  });
  return {bills:list,
    due:sum(list,function(b){return num(b.amount);}),
    got:sum(list,function(b){return num(b.paidAmount);}),count:list.length};
}
function monthTxnStats(d,cm){
  var list=(d.txns||[]).filter(function(t){return String(t.date||'').slice(0,7)===cm;});
  return {income:sum(list,function(t){return t.type==='收入'?num(t.amount):0;}),
    expense:sum(list,function(t){return t.type==='支出'?num(t.amount):0;}),count:list.length};
}

/* 收租时间尺：只读渲染未来两周（-6 ~ +7 天）的收租节点，不写入任何业务数据 */
function rentRulerHTML(st){
  var base=new Date(today()+'T00:00:00');
  // 窗口覆盖到 16 天后，红 / 黄 / 绿三档都能在时间尺上真实出现
  var FROM=-3, TO=DUE_AMBER_MAX+1;
  var days=[], i, j, d;
  for(i=FROM;i<=TO;i++){
    d=new Date(base.getTime()); d.setDate(d.getDate()+i);
    days.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
      label:pad(d.getDate()), mon:d.getMonth()+1, off:i, items:[]});
  }
  var last=days.length-1;
  var firstKey=days[0].key, lastKey=days[last].key;
  var earlier=0, earlierAmt=0;
  (st.list||[]).forEach(function(x){
    if(!x.date) return;
    if(x.date<firstKey){ earlier++; earlierAmt+=num(x.amount); return; }
    if(x.date>lastKey) return;
    for(j=0;j<days.length;j++){ if(days[j].key===x.date){ days[j].items.push(x); break; } }
  });
  // 早于窗口起点的逾期统一归到第一格，信息不丢失
  if(earlier) days[0].items.push({tone:'danger',level:'overdue',earlier:earlier,amount:earlierAmt,roomId:'',tenantId:'',text:''});
  var inWindow=0;
  days.forEach(function(day){ inWindow+=day.items.length; });
  var cells=days.map(function(day){
    var cls='', ev='', tips=[], rank=0, top='', earlierItem=null;
    var weight={danger:3,warn:2,ok:1};
    day.items.forEach(function(x){
      var t=dueTone(x);
      if((weight[t]||0)>rank){ rank=weight[t]||0; top=t; }
      if(x.earlier) earlierItem=x;
      tips.push((x.roomId?roomLabel(getRoom(x.roomId)):'更早逾期')+' · '+
        (x.tenantId?tenantLabel(x.tenantId):'多笔')+' · '+money(x.amount)+
        (x.text?'（'+x.text+'）':''));
    });
    if(top) cls='t-'+top;                    // 同日多笔时取最紧急的一档
    if(day.off===0) cls+=(cls?' ':'')+'today';
    if(earlierItem) ev='更早 '+earlierItem.earlier+' 笔';
    else if(day.off===0) ev=day.items.length?('今天 · '+day.items.length+' 笔'):'今天';
    else if(day.items.length) ev=day.items.length+' 笔';
    var title=day.key+(tips.length?' · '+tips.join('；'):' · 无收租安排');
    return '<div class="rday '+cls+'" title="'+esc(title)+'"><span class="pt"></span>'+
      '<span class="d">'+esc(day.label)+'</span><span class="ev">'+esc(ev)+'</span></div>';
  }).join('');
  var head=days[0].mon+' 月 '+days[0].label+' 日 — '+days[last].mon+' 月 '+days[last].label+' 日';
  var legend='<span><i style="background:var(--danger)"></i>逾期 / 1–10 天（红）</span>'+
    '<span><i style="background:var(--warn)"></i>11–15 天（黄）</span>'+
    '<span><i style="background:var(--ok)"></i>16 天以上（绿）</span>';
  var note='';
  if(st.overdue.length){
    var o=st.overdue[0];
    note='<div class="ruler-note danger">'+svg('alert')+
      '<span>'+esc(roomLabel(getRoom(o.roomId)))+' · '+esc(tenantLabel(o.tenantId))+
      ' 已逾期 '+Math.abs(num(o.days))+' 天，待收 '+money(o.amount)+'</span>'+
      (o.billId?'<button class="mini-btn" data-act="receive-bill" data-id="'+esc(o.billId)+'">立即收款</button>':
        '<button class="mini-btn" data-act="nav" data-page="reminders">查看提醒</button>')+'</div>';
  }else{
    note='<div class="ruler-note info">'+svg('check')+'<span>当前没有逾期款项；'+
      (st.soon.length?'有 '+st.soon.length+' 笔将在 '+leadDays()+' 天内到期。':'暂无临近到期的收租安排。')+'</span></div>';
  }
  var body=(st.list&&st.list.length)?
    ('<div class="ruler-top"><span class="t">'+esc(head)+' · 窗口内 '+inWindow+' 个节点 / 共 '+st.list.length+' 项收租安排</span><span class="lg">'+legend+'</span></div>'+
      '<div class="ruler-scroll"><div class="ruler-line"></div><div class="ruler-days">'+cells+'</div></div>'+note):
    ('<div class="ruler-empty">'+svg('calendar')+'暂无收租安排。签订合同并生成账单后，这里会显示未来两周的收租节点。</div>');
  return '<div class="card section"><div class="card-head"><h2>收租时间尺 <span class="hint">今天前 3 天 ~ 后 16 天 · 红 1–10 天 / 黄 11–15 天 / 绿 16 天以上</span></h2>'+
    '<button class="link" data-act="nav" data-page="reminders">查看全部提醒 →</button></div>'+
    '<div class="ruler">'+body+'</div></div>';
}

/* 桌面通知：仅在页面打开期间、用户主动开启后触发 */
function notifyPermission(cb){
  if(typeof Notification==='undefined'){ cb('unsupported'); return; }
  var done=false;
  function once(p){ if(done) return; done=true; cb(p); }
  try{
    if(Notification.permission==='granted'){ once('granted'); return; }
    if(Notification.permission==='denied'){ once('denied'); return; }
    var r=Notification.requestPermission(function(p){ once(p); });
    if(r && typeof r.then==='function') r.then(function(p){ once(p); },function(){ once('denied'); });
  }catch(e){ once('denied'); }
}
function maybeNotify(){
  if(notifiedThisLoad) return;
  var s=settings();
  if(!s.reminderEnabled || !s.browserNotify) return;
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  var st=reminderStats();
  if(!st.attention.length) return;
  notifiedThisLoad=true;
  var body='逾期 '+st.overdue.length+' 笔，今天到期 '+st.today.length+' 笔，'+leadDays()+' 天内到期 '+st.soon.length+' 笔。合计 '+money(sum(st.attention,function(i){return i.amount;}));
  try{
    var n=new Notification('收租提醒 · '+st.attention.length+' 笔需要跟进',{body:body,tag:'rental-reminder'});
    n.onclick=function(){ window.focus(); state.page='reminders'; render(); n.close(); };
  }catch(e){ /* 部分浏览器在 file:// 下禁止构造通知，静默降级为页面内提醒 */ }
}
function testNotify(){
  var s=settings();
  if(typeof Notification==='undefined'){ toast('当前浏览器不支持桌面通知','err'); return; }
  notifyPermission(function(p){
    if(p!=='granted'){ toast('未获得通知权限，请检查浏览器站点设置','err'); return; }
    try{
      new Notification('收租提醒测试',{body:'通知已开启。系统每次打开时会汇总提醒临近收租和逾期的房租。',tag:'rental-test'});
      toast('已发送测试通知','ok');
    }catch(e){ toast('通知发送失败：'+e.message,'err'); }
  });
}

var ATTACH_EXT = {'jpg':'image/jpeg','jpeg':'image/jpeg','jpe':'image/jpeg','jepg':'image/jpeg','png':'image/png','pdf':'application/pdf'};
var ATTACH_MAX_FILE = 2*1024*1024;     // 单文件上限 2 MB
var ATTACH_BUDGET  = 4.3*1024*1024;   // 单文件模式安全容量（字符数），避免撑爆 localStorage
var ATTACH_BUDGET_NAS = 48*1024*1024; // NAS 模式放宽：数据落服务器磁盘，由服务端 64 MB 上限兜底
function attachBudget(){ return sync.mode==='server' ? ATTACH_BUDGET_NAS : ATTACH_BUDGET; }

function fmtSize(n){ n=Number(n)||0; return n>=1024*1024 ? (n/1024/1024).toFixed(2)+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
function attachmentMime(file){
  var ext=String(file.name||'').split('.').pop().toLowerCase();
  var byExt=ATTACH_EXT[ext]||'';
  var t=String(file.type||'').toLowerCase();
  var byType=ATTACH_TYPES[t]?t:'';
  if(!byType && (t==='image/jpg'||t==='image/pjpeg')) byType='image/jpeg';  // 兼容旧浏览器的 JPEG 写法
  if(!byExt) return '';
  if(byType) return byType;
  if(!t || t==='application/octet-stream') return byExt;  // 部分浏览器不提供 PDF 的 MIME
  return '';
}
function storageChars(){ try{ return JSON.stringify(db).length; }catch(e){ return 0; } }
function pendingChars(){
  if((window.__attachCtx||{}).type!=='form') return 0;
  return (window.__formAttachments||[]).reduce(function(t,a){ return t+String(a.data||'').length+120; },0);
}
function attachmentList(){
  var ctx=window.__attachCtx||{};
  if(ctx.type==='form'){
    if(!Array.isArray(window.__formAttachments)) window.__formAttachments=[];
    return window.__formAttachments;
  }
  var c=getContract(ctx.id); if(!c) return [];
  if(!Array.isArray(c.attachments)) c.attachments=[];
  return c.attachments;
}
function findAttachment(aid){
  var list=attachmentList();
  for(var i=0;i<list.length;i++) if(list[i].id===aid) return list[i];
  return (window.__previewAttachment && window.__previewAttachment.id===aid) ? window.__previewAttachment : null;
}
function dataURLToBlob(att){
  var i=String(att.data).indexOf(',');
  var bin=atob(i>=0?String(att.data).slice(i+1):''), n=bin.length, arr=new Uint8Array(n);
  while(n--) arr[n]=bin.charCodeAt(n);
  return new Blob([arr],{type:att.type});
}
function canStoreAttachment(att){
  if(storageChars() + String(att.data||'').length + 120 + pendingChars() > attachBudget()){
    toast('存储空间不足，请先导出 JSON 备份并删除不用的附件，或压缩文件后重试','err');
    return false;
  }
  return true;
}
function readAttachment(file,ok,fail){
  var mime=attachmentMime(file), name=String(file.name||'合同附件');
  if(!mime){ toast('仅支持 JPG / JPEG / PNG / PDF 格式：'+name,'err'); fail(); return; }
  if(Number(file.size)>ATTACH_MAX_FILE){ toast('文件超过 2 MB，请压缩后上传：'+name,'err'); fail(); return; }
  var reader=new FileReader();
  reader.onload=function(){
    var raw=String(reader.result||''), i=raw.indexOf(',');
    if(i<0){ toast('读取文件失败：'+name,'err'); fail(); return; }
    ok({id:uid(),name:name,type:mime,size:Number(file.size)||0,
      data:'data:'+mime+';base64,'+raw.slice(i+1),uploadedAt:today()});
  };
  reader.onerror=function(){ toast('读取文件失败：'+name,'err'); fail(); };
  reader.readAsDataURL(file);
}
function storeAttachment(att){
  if((window.__attachCtx||{}).type==='form'){ attachmentList().push(att); return true; }
  var c=getContract((window.__attachCtx||{}).id); if(!c) return false;
  var list=attachmentList(); list.push(att);
  if(!save()){ list.pop(); return false; }   // 写入失败立即回滚，不留半条脏数据
  return true;
}
function handleAttachmentFiles(files){
  var queue=Array.prototype.slice.call(files||[]), added=0, failed=0;
  function next(){
    if(!queue.length){
      if(added){
        renderAttachments();
        if((window.__attachCtx||{}).type==='contract') render();
      }
      toast(added?('已添加 '+added+' 个附件'+(failed?'，'+failed+' 个未添加':'')):'没有可添加的附件',added?'ok':'err');
      return;
    }
    var f=queue.shift();
    readAttachment(f,function(att){
      if(canStoreAttachment(att) && storeAttachment(att)) added++; else failed++;
      next();
    },function(){ failed++; next(); });
  }
  next();
}

function openAttachments(id){

function removeAttachment(aid){
  var ctx=window.__attachCtx||{};
  var next=attachmentList().filter(function(a){ return a.id!==aid; });
  if(ctx.type==='form'){
    window.__formAttachments=next; renderAttachments(); toast('已移除附件，保存前可重新上传');
  }else{
    var c=getContract(ctx.id); if(!c) return;
    c.attachments=next; save(); renderAttachments(); render(); toast('附件已删除');
  }
}
function downloadAttachment(att){
  if(!att) return;
  try{
    var url=URL.createObjectURL(dataURLToBlob(att));
    var a=document.createElement('a'); a.href=url; a.download=att.name;
    document.body.appendChild(a); if(a.click) a.click(); if(a.remove) a.remove();
    setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(e){} },3000);
  }catch(e){ toast('下载失败，请使用「预览」后另存','err'); }
}
function closeAttachmentPreview(){

}
function previewAttachment(aid){
  var att=findAttachment(aid); if(!att) return;
  window.__previewAttachment=att;
  var isImg=(att.type==='image/jpeg'||att.type==='image/png'), content='', extra='';
  if(isImg){
    content='<img src="'+esc(att.data)+'" alt="'+esc(att.name)+'">';
  }else{
    var url='';
    try{ url=URL.createObjectURL(dataURLToBlob(att)); window.__previewURL=url; }catch(e){}
    content=url ? '<iframe src="'+esc(url)+'" title="合同 PDF 预览"></iframe>' :
      '<div class="sub-txt" style="padding:40px 0">当前浏览器无法内嵌预览 PDF，请点「下载原件」后用系统 PDF 阅读器打开。</div>';
    if(url) extra='<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">在新标签打开</a>';
  }
  var layer=document.createElement('div');
  layer.className='mask attach-preview-mask'; layer.id='attachPreview';
  layer.innerHTML='<div class="modal"><div class="modal-head"><h3>'+esc(att.name)+'</h3>'+
    '<button class="x-btn" data-act="attach-preview-close">'+svg('close')+'</button></div>'+
    '<div class="modal-body"><div class="attach-preview-body">'+content+'</div>'+
    '<div class="sub-txt" style="margin-top:8px">'+esc(att.type)+' · '+fmtSize(att.size)+' · 上传于 '+esc(att.uploadedAt||'—')+'</div></div>'+
    '<div class="modal-foot">'+extra+

    '<button class="btn" data-act="attach-preview-close">关闭预览</button></div></div>';
  var root=document.getElementById('modalRoot');
  if(root && root.appendChild) root.appendChild(layer);
}

/* 合同行「⋯」菜单：同一时间只展开一个，点击别处或执行任意动作后自动收起 */
function closeRowMenus(){
  var mid=window.__rowMenuId;
  if(!mid) return;
  var m=document.getElementById('rowMenu_'+mid); if(m && m.setAttribute) m.setAttribute('hidden','');
  var b=document.getElementById('rowBtn_'+mid); if(b && b.setAttribute) b.setAttribute('aria-expanded','false');
  window.__rowMenuId='';
}
/* 重绘前清掉上一批挂到 body 的菜单，避免重复 id 与残留浮层 */
function purgeRowMenus(){
  closeRowMenus();
  var nodes=document.querySelectorAll?document.querySelectorAll('body > .row-menu'):[];
  Array.prototype.forEach.call(nodes,function(n){ if(n.remove) n.remove(); });
}
/* 按按钮在视口中的位置换算成文档坐标定位：优先向下，空间不足则向上翻 */
function placeRowMenu(btn,menu){
  if(!btn.getBoundingClientRect || !menu.style) return;
  var r=btn.getBoundingClientRect();
  var mw=menu.offsetWidth||170, mh=menu.offsetHeight||210;
  var vw=window.innerWidth||1280, vh=window.innerHeight||800;
  var sx=window.pageXOffset||0, sy=window.pageYOffset||0;
  var top=r.bottom+4+sy;
  if(r.bottom+4+mh>vh-8) top=Math.max(sy+8,r.top-mh-4+sy);
  var left=Math.max(sx+8,Math.min(r.right-mw+sx,sx+vw-mw-8));
  menu.style.top=Math.round(top)+'px';
  menu.style.left=Math.round(left)+'px';
}
/* 菜单用文档坐标挂在 body 上，滚动时本就随文档一起走；只需在滚动/改尺寸后重新贴合按钮 */
function repositionRowMenu(){
  var mid=window.__rowMenuId; if(!mid) return;
  var menu=document.getElementById('rowMenu_'+mid), btn=document.getElementById('rowBtn_'+mid);
  if(menu && btn && !(menu.hasAttribute&&menu.hasAttribute('hidden'))) placeRowMenu(btn,menu);
}
function toggleRowMenu(btn){
  var id=btn.getAttribute('data-id');
  var menu=document.getElementById('rowMenu_'+id); if(!menu) return;
  var willOpen=(menu.hasAttribute&&menu.hasAttribute('hidden'))||menu.hidden===true||!menu.hasAttribute;
  closeRowMenus();
  if(!willOpen) return;
  if(menu.removeAttribute) menu.removeAttribute('hidden');
  // 挂到 body，彻底脱离表格 / 卡片的 overflow 裁剪
  if(document.body && document.body.appendChild) document.body.appendChild(menu);
  btn.setAttribute('aria-expanded','true');
  window.__rowMenuId=id;
  placeRowMenu(btn,menu);
}

/* NAS 快照：列表 / 手动生成 / 下载 */
function loadNasBackups(){
  var box=document.getElementById('nasBackupList'); if(!box) return;
  box.innerHTML='<span class="sub-txt">正在读取快照列表…</span>';
  fetchJSON('api/backups',{cache:'no-store'},6000).then(function(r){
    var host=document.getElementById('nasBackupList'); if(!host) return;
    var list=r.backups||[];
    if(!list.length){ host.innerHTML='<span class="sub-txt">暂无快照。保存一次数据，或点击「立即生成快照」即可创建。</span>'; return; }
    host.innerHTML='<div class="table-wrap"><table><thead><tr><th>快照文件</th><th>生成时间</th><th>大小</th><th style="width:88px">操作</th></tr></thead><tbody>'+
      list.slice(0,15).map(function(b){
        return '<tr><td>'+esc(b.name)+'</td><td>'+esc(b.time||'—')+'</td><td>'+esc(fmtSize(b.size))+'</td>'+
          '<td class="acts"><a class="btn btn-sm" href="api/backups/'+encodeURIComponent(b.name)+'" download>下载</a></td></tr>';
      }).join('')+'</tbody></table></div>';
  }).catch(function(e){
    var host=document.getElementById('nasBackupList');
    if(host) host.innerHTML='<span class="sub-txt">读取失败：'+esc(e.message)+'</span>';
  });
}
function nasSnapshot(){
  fetchJSON('api/backups',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'},10000)
    .then(function(r){ toast('已生成快照 '+(r.name||''),'ok'); loadNasBackups(); })
    .catch(function(e){ toast('生成快照失败：'+e.message,'err'); });
}
function download(filename,content,mime){
  var blob=new Blob([content],{type:mime||'application/octet-stream'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
}
function exportJSON(){
  download('栖间NestLedger_备份_'+today()+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');
  toast('备份已导出','ok');
}
function exportCSV(){
  var head=['账期','本期收租时间','下次交租时间','付款方式','房源','房号','租客','应收金额','已收金额','待收金额','状态','收款日期','备注'];
  var lines=[head.join(',')];
  db.bills.slice().sort(function(a,b){return a.period<b.period?-1:1;}).forEach(function(b){
    var r=getRoom(b.roomId), p=r?getProperty(r.propertyId):null, c=getContract(b.contractId);
    var row=[periodLabel(b),b.dueDate,c?nextDueAfterBill(c,b):'',c?c.payCycle:'',
      p?p.name:'',r?r.roomNo:'',tenantLabel(b.tenantId),
      b.amount,b.paidAmount,round2(num(b.amount)-num(b.paidAmount)),billStatus(b),b.paidDate||'',b.note||''];
    lines.push(row.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(','));
  });
  download('栖间NestLedger_账单_'+today()+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');
  toast('账单 CSV 已导出','ok');
}
function importJSON(){
  var input=document.getElementById('importFile');
  if(!input || !input.files || !input.files[0]){ toast('请先选择 JSON 备份文件','err'); return; }
  var reader=new FileReader();
  reader.onload=function(){
    var d;
    try{ d=validateDB(JSON.parse(reader.result)); }
    catch(e){ toast('导入失败：'+e.message,'err'); return; }
    var importedAtt=(d.contracts||[]).reduce(function(t,c){return t+((c.attachments||[]).length);},0);
    confirmBox('确认导入','将用备份文件覆盖当前的全部数据。<br><br>备份包含：房源 <b>'+d.properties.length+'</b>、房间 <b>'+d.rooms.length+'</b>、租客 <b>'+d.tenants.length+'</b>、合同 <b>'+d.contracts.length+'</b>、合同附件 <b>'+importedAtt+'</b>、账单 <b>'+d.bills.length+'</b>、流水 <b>'+d.txns.length+'</b>。<br><br>此操作不可撤销。',function(){
      db=normalizeContracts(normalizeSettings(d)); if(!db.meta) db.meta={demo:false,createdAt:today()};
      save(); modalClose(); render(); toast('数据导入成功','ok');
    },true);
  };
  reader.readAsText(input.files[0],'utf-8');
}

/* 改了收租时间后，把该合同未结清账单的收租时间同步到新锚点；已收账单保留历史不动 */
function resyncBillDueDates(c, oldCycle){
  if(CYCLE[oldCycle]!==cycleMonths(c)) return -1;   // 付款方式变了，期次结构变化，不自动重算
  var span=cycleMonths(c), startM=billStartMonth(c), n=0;
  if(!/^\d{4}-\d{2}$/.test(startM)) return 0;
  db.bills.forEach(function(b){
    if(b.contractId!==c.id || billStatus(b)==='已收') return;
    var diff=(+b.period.slice(0,4)*12 + +b.period.slice(5,7))-(+startM.slice(0,4)*12 + +startM.slice(5,7));
    if(diff<0 || diff%span!==0) return;             // 手工改过账期的账单跳过
    var due=rentDateAt(c,diff/span);
    if(due && due!==b.dueDate){ b.dueDate=due; b.status=billStatus(b); n++; }
  });
  return n;
}
/* 把「本次租金」改为已收讫时，若首期账单还在待收，自动登记收讫并补一笔收入流水，
   使页面下次交租时间立即顺延到下一期，而不会出现「改了却没变化」。 */
function settleFirstPeriod(c){
  var startM=billStartMonth(c);
  var b=db.bills.filter(function(x){return x.contractId===c.id && x.period===startM;})[0];
  if(!b || billStatus(b)==='已收') return 0;
  var rest=round2(num(b.amount)-num(b.paidAmount));
  b.paidAmount=num(b.amount); b.paidDate=rentDateOf(c); b.status='已收';
  if(rest>0) pushTxn('收入','租金',rest,b.paidDate,b.roomId,b.tenantId,b.id,
    '本次收租（签约收讫）· '+periodLabel(b));
  return 1;
}

  var c=getContract(id); if(!c) return;
  window.__formAttachments=Array.isArray(c.attachments)?c.attachments.slice():[];
  openForm({title:'编辑合同',wide:true,values:c,fields:contractFormFields(c),
    validate:validateContract,
    onShow:function(){ updateNextRentPreview(); initAttachments('form'); },
    note:'修改<b>本次收租时间</b>后，未结清账单的收租时间会同步更新，下次交租时间重新计算；已收账单保留历史。把「本次租金」改为<b>已收讫</b>时，待收的首期账单会自动登记收讫并补记收入流水。',
    onSubmit:function(v){
      var dup=activeContractOf(v.roomId);
      if(v.status==='生效中' && dup && dup.id!==id){ toast('目标房间已有其他生效中的合同','err'); return; }
      var oldCycle=c.payCycle, oldRent=rentDateOf(c), oldSettled=c.rentSettled||'待收';
      Object.keys(v).forEach(function(k){c[k]=v[k];});
      c.attachments=(window.__formAttachments||[]).slice();
      var settledN=(v.rentSettled==='已收讫' && oldSettled!=='已收讫') ? settleFirstPeriod(c) : 0;
      var n=resyncBillDueDates(c,oldCycle);
      var r=getRoom(c.roomId);
      if(r){
        if(c.status==='生效中') r.status='已租';
        else if(r.status==='已租' && !activeContractOf(r.id)) r.status='空置';
      }
      save();modalClose();render();
      if(n===-1) toast('合同已保存；付款方式已变更，请到账单页核对已生成账单的收租时间','ok');
      else if(settledN) toast('合同已保存；本次租金已登记收讫，下次交租时间已顺延到下一期','ok');
      else if(oldRent!==rentDateOf(c)) toast('合同已保存'+(n?'，已同步 '+n+' 笔未结清账单的收租时间':''),'ok');
      else toast('合同已保存','ok');
    }});
}

document.addEventListener('click',function(e){
  if(e.target && e.target.id==='attachPreview'){ closeAttachmentPreview(); return; }
  if(e.target.hasAttribute && e.target.hasAttribute('data-mask')){ modalClose(); return; }
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  var act=el?el.getAttribute('data-act'):'';
  if(act!=='row-menu') closeRowMenus();
  if(!el) return;
  var id=el.getAttribute('data-id');
  switch(act){
    case 'open-about': aboutDialog(); break;
    case 'upd-check': updCheck(true); break;
    case 'upd-apply': updApply(); break;
    case 'upd-config': updConfig(el.getAttribute('data-key'),el.getAttribute('data-val')); break;
    case 'upd-rollback': updRollback(); break;

    case 'set-theme': setTheme(el.getAttribute('data-theme')); break;
    case 'toggle-theme': setTheme(currentTheme==='dark'?'light':'dark'); break;
    case 'bulk': doBulk(el.getAttribute('data-page'),el.getAttribute('data-op')); break;
    case 'row-menu': toggleRowMenu(el); break;
    case 'nav': state.page=el.getAttribute('data-page'); render(); break;
