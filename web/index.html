    case 'confirm-yes': if(window.__confirmCb){var cb=window.__confirmCb;window.__confirmCb=null;cb();} break;
    case 'form-submit': submitForm(); break;
    case 'rooms-tab': state.tab.rooms=el.getAttribute('data-tab'); render(); break;
    case 'view-rooms': state.tab.rooms='room'; state.f.rooms.property=id; state.f.rooms.status='all'; state.f.rooms.q=''; state.page='rooms'; render(); break;
    case 'add-property': addProperty(); break;
    case 'edit-property': editProperty(id); break;
    case 'delete-property': deleteProperty(id); break;
    case 'add-room': addRoom(); break;
    case 'edit-room': editRoom(id); break;
    case 'delete-room': deleteRoom(id); break;
    case 'toggle-room-status': toggleRoomStatus(id); break;
    case 'add-tenant': addTenant(); break;
    case 'edit-tenant': editTenant(id); break;
    case 'delete-tenant': deleteTenant(id); break;
    case 'add-contract': addContract(); break;
    case 'edit-contract': editContract(id); break;
    case 'delete-contract': deleteContract(id); break;
    case 'contract-detail': contractDetail(id); break;
    case 'contract-files': openAttachments(id); break;
    case 'attach-pick': { var picker=document.getElementById('attachFileInput'); if(picker && picker.click) picker.click(); break; }
    case 'attach-view': previewAttachment(id); break;
    case 'attach-download': downloadAttachment(findAttachment(id)); break;
    case 'attach-remove': removeAttachment(id); break;
    case 'attach-preview-close': closeAttachmentPreview(); break;
    case 'attach-preview-download': downloadAttachment(window.__previewAttachment); break;
    case 'terminate-contract': terminateContract(id); break;
    case 'go-gen': genBillsDialog(); break;
    case 'clear-bill-filter': state.f.bills={status:'all',month:'all',q:''}; render(); break;
    case 'gen-bills-for': {
      var c=getContract(id); if(!c) break;
      var saved=db.contracts;
      var req=el.getAttribute('data-month')||curMonth();
      var endM=String(c.endDate||'').slice(0,7);
      var through=(!endM || req<endM) ? req : endM;
      var removed=removeMisalignedBills(db,c.id);
      var before=db.bills.length;
      try{ db.contracts=[c]; makeBillsFor(db,through); }
      finally{ db.contracts=saved; }
      var n=db.bills.length-before; save(); modalClose(); revealBills(); render();
      var msg=n>0?'已为该合同生成 '+n+' 笔账单，已切到租金账单页':'本次没有新增账单：该期间已生成过，或已超出合同到期日';
      if(removed) msg+='；已清理 '+removed+' 笔旧版错位账单';
      toast(msg,(n>0||removed)?'ok':'');
      break;
    }
    case 'test-notify': testNotify(); break;
    case 'receive-bill': receiveBill(id); break;
    case 'edit-bill': editBill(id); break;
    case 'delete-bill': deleteBill(id); break;
    case 'add-txn': addTxn(); break;
    case 'delete-txn': deleteTxn(id); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import-json': importJSON(); break;
    case 'nas-snapshot': nasSnapshot(); break;
    case 'nas-refresh': loadNasBackups(); break;
    case 'load-demo': confirmBox('重新载入示例数据','当前全部数据将被示例数据覆盖，且不可恢复。建议先导出备份。',function(){
      db=buildDemo();save();modalClose();render();toast('示例数据已载入','ok');},true); break;
    case 'clear-all': confirmBox('清空全部数据','将删除所有房源、房间、租客、合同、账单与流水，<b>不可恢复</b>。<br><br>请确认已经导出 JSON 备份。',function(){
      db=emptyDB();save();modalClose();state.page='dashboard';render();toast('数据已清空');},true); break;
  }
});

document.addEventListener('change',function(e){
  var el=e.target;
  if(el.classList && el.classList.contains('row-check')){
    var k=el.getAttribute('data-bulk-page'), rid=el.getAttribute('data-id');
    if(k && state.sel[k]){
      var arr=state.sel[k], i=arr.indexOf(rid);
      if(el.checked){ if(i<0) arr.push(rid); }else if(i>=0){ arr.splice(i,1); }
      updateBulkUI(k);
    }
    return;
  }
  if(el.classList && el.classList.contains('check-all')){
    var k2=el.getAttribute('data-bulk-page');
    if(k2 && state.sel[k2]){
      var host=el.closest?el.closest('.table-wrap'):null;
      var ids=[];
      if(host) Array.prototype.forEach.call(host.querySelectorAll('.row-check'),function(c){ ids.push(c.getAttribute('data-id')); });
      state.sel[k2]=el.checked?ids:[];
      updateBulkUI(k2);
    }
    return;
  }
  updateNextRentPreview();
  if(el.hasAttribute && el.hasAttribute('data-attach-input')){
    var picked=el.files?Array.prototype.slice.call(el.files):[];
    try{ el.value=''; }catch(_){}
    if(picked.length) handleAttachmentFiles(picked);
    return;
  }
  if(el.hasAttribute && el.hasAttribute('data-setting')){
    normalizeSettings(db);
    var key=el.getAttribute('data-setting'), val=String(el.value);
    if(key==='reminderEnabled' || key==='browserNotify'){
      db.settings[key]=(val==='1');
      if(key==='browserNotify' && val==='1'){
        notifyPermission(function(p){
          if(p!=='granted'){
            db.settings.browserNotify=false;
            save(); render(); toast('未获得通知权限，已保持关闭','err');
          }else{
            notifiedThisLoad=false;
            save(); render(); maybeNotify(); toast('桌面通知已开启','ok');
          }
        });
        return;
      }
    }else if(key==='reminderDays'){
      var n=Math.round(num(val));
      if(!n || n<1 || n>60){ toast('提前天数需为 1–60 之间的整数','err'); render(); return; }
      db.settings.reminderDays=n;
    }
    save(); render(); toast('提醒设置已保存','ok');
    return;
  }
  if(el.hasAttribute && el.hasAttribute('data-filter')){
    var fkey=el.getAttribute('data-filter'), page=el.getAttribute('data-page');
    if(fkey!=='q' && state.f[page]){ state.f[page][fkey]=el.value; render(); }
  }
});

/* ---------------- 版本与自动更新 ----------------
   APP_VERSION 由 scripts/sync-version.mjs 注入并维护。
   NAS 模式：调用本服务端 /api/update/*，由服务端去 GitHub 拉取更新包。
   单文件本地模式：只显示版本号，绝不发起任何网络请求。
   ------------------------------------------------ */
var upd={
  mode:'local',version:APP_VERSION,builtin:APP_VERSION,overlay:null,
  latest:null,hasUpdate:false,auto:true,autoRestart:true,enabled:false,
  lastCheck:'',lastError:'',source:'',lastApplied:null,
  checking:false,applying:false,checked:false
};
function updServerMode(){ return location.protocol==='http:'||location.protocol==='https:'; }
function updFetch(url,opt,timeout){
  opt=opt||{};
  if(typeof fetch!=='function') return Promise.reject(new Error('浏览器不支持 fetch'));
  var ctl=(typeof AbortController==='function')?new AbortController():null;
  if(ctl) opt.signal=ctl.signal;
  var timer=setTimeout(function(){ if(ctl){ try{ctl.abort();}catch(e){} } },timeout||12000);
  return fetch(url,opt).then(function(r){
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  },function(e){ clearTimeout(timer); throw e; });
}
function updFmt(t){
  if(!t) return '';
  var d=new Date(t);
  if(isNaN(d.getTime())) return String(t);
  function p(n){ return String(n).padStart(2,'0'); }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function updPost(p,body,timeout){
  return updFetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})},timeout||120000);
}
function refreshUpdChip(){
  var el=document.getElementById('verChip'); if(!el) return;
  el.className='ver-chip'+(upd.hasUpdate?' has-update':'');
  el.innerHTML='<span>v'+esc(upd.version)+'</span>'+(upd.hasUpdate?'<i class="ver-dot"></i>':'');
  el.setAttribute('title',upd.hasUpdate
    ?('发现新版本 v'+((upd.latest&&upd.latest.version)||'')+' · 点击查看并更新')
    :('栖间 · NestLedger v'+upd.version+' · 查看关于与更新'));
}
function mountVerChip(){
  var host=document.querySelector('.top-right');
  if(!host||document.getElementById('verChip')) return;
  var b=document.createElement('button');
  b.type='button'; b.id='verChip'; b.className='ver-chip';
  b.setAttribute('data-act','open-about'); b.setAttribute('aria-label','关于与更新');
  host.insertBefore(b,host.firstChild);
  refreshUpdChip();
}
function updApplyStatus(s){
  if(!s||typeof s!=='object') return;
  upd.enabled=!!s.enabled;
  upd.builtin=s.builtin||upd.builtin;
  upd.overlay=s.overlay||null;
  upd.version=s.current||upd.version;
  upd.auto=s.auto!==false;
  upd.autoRestart=s.autoRestart!==false;
  upd.lastCheck=s.lastCheck||'';
  upd.lastError=s.lastError||'';
  upd.source=s.source||'';
  upd.latest=s.latest||null;
  upd.hasUpdate=!!s.hasUpdate;
  upd.lastApplied=s.lastApplied||null;
  upd.checked=true;
  refreshUpdChip();
  if(document.getElementById('updPanel')) updRenderPanel();
}
function updStatus(){
  if(!updServerMode()) return Promise.resolve(null);
  return updFetch('/api/update/status',{},8000).then(function(s){ updApplyStatus(s); return s; })
    .catch(function(){ upd.enabled=false; refreshUpdChip(); return null; });
}
function updCheck(force){
  if(!updServerMode()){ toast('单文件本地版不联网，请手动下载新版 HTML',''); return; }
  if(upd.checking||upd.applying) return;
  upd.checking=true; upd.lastError=''; updRenderPanel();
  updFetch('/api/update/check'+(force?'?force=1':''),{},30000).then(function(r){
    upd.checking=false;
    updApplyStatus(r);
    upd.lastError=r.error||'';
    refreshUpdChip();
    if(r.error){ if(force) toast('检查失败：'+upd.lastError,'err'); }
    else if(r.hasUpdate) toast('发现新版本 v'+r.latest.version,'ok');
    else if(force) toast('已是最新版本','ok');
    updRenderPanel();
  }).catch(function(e){
    upd.checking=false; upd.lastError=(e&&e.message)||String(e);
    updRenderPanel(); toast('检查更新失败：'+upd.lastError,'err');
  });
}
function updWaitReload(){
  var n=0, t=setInterval(function(){
    n++;
    updFetch('/api/health',{},3000).then(function(){ clearInterval(t); location.reload(); }).catch(function(){});
    if(n>30){ clearInterval(t); location.reload(); }
  },2000);
}
function updApply(){
  if(upd.applying) return;
  upd.applying=true; upd.lastError=''; updRenderPanel();
  updPost('/api/update/apply',{},180000).then(function(r){
    upd.applying=false;
    if(r.error) throw new Error(r.error);
    if(r.already){ upd.applying=false; updRenderPanel(); toast('已是最新版本','ok'); return; }
    toast('已更新到 v'+r.version+(r.restarting?'，容器即将重启':''),'ok');
    if(r.restarting) setTimeout(updWaitReload,3000);
    else setTimeout(function(){ location.reload(); },1200);
  }).catch(function(e){
    upd.applying=false; upd.lastError=(e&&e.message)||String(e);
    updRenderPanel(); toast('更新失败：'+upd.lastError,'err');
  });
}
function updConfig(key,val){
  var body={}; body[key]=(val==='1');
  updPost('/api/update/config',body,10000).then(function(s){ updApplyStatus(s); toast('设置已保存','ok'); })
    .catch(function(e){ toast('保存失败：'+((e&&e.message)||String(e)),'err'); });
}
function updRollback(){
  confirmBox('恢复内置版本','将删除已下载的更新覆盖层，回到容器内置的 <b>v'+esc(upd.builtin)+'</b>。<br><br>业务数据 <code>data/db.json</code> 完全不受影响。',function(){
    updPost('/api/update/rollback',{},20000).then(function(r){
      if(r.error) throw new Error(r.error);
      modalClose(); toast('已恢复内置版本','ok');
      if(r.restarting) setTimeout(updWaitReload,3000); else setTimeout(function(){ location.reload(); },1500);
    }).catch(function(e){ toast('恢复失败：'+((e&&e.message)||String(e)),'err'); });
  },true);
}
function updRestart(){
  updPost('/api/update/restart',{},10000).then(function(r){
    if(r.error) throw new Error(r.error);
    modalClose(); toast('正在重启容器…','ok'); setTimeout(updWaitReload,3000);
  }).catch(function(e){ toast('重启失败：'+((e&&e.message)||String(e)),'err'); });
}
function updBodyHTML(){
  var rows='';
  function row(k,v){ rows+='<div>'+k+'</div><div>'+v+'</div>'; }
  row('当前版本','<b>v'+esc(upd.version)+'</b>'+(upd.overlay&&upd.overlay!==upd.builtin?' · 由自动更新覆盖层提供':' · 容器内置'));
  row('运行模式',upd.mode==='server'?'NAS / Docker 服务端':'单文件本地版');
  row('内置版本','v'+esc(upd.builtin)+(upd.overlay?' · 覆盖层 v'+esc(upd.overlay):''));
  row('更新来源',upd.mode==='server'?esc(upd.source||'GitHub · lq-wq/nestledger'):'不联网');
  row('最近检查',upd.lastCheck?esc(updFmt(upd.lastCheck)):'尚未检查');
  var notice='';
  if(upd.mode!=='server'){
    notice='<div class="notice"><div>当前是<b>单文件本地版</b>（<code>file://</code>），数据只存在本机浏览器，为保证零网络请求，<b>不提供自动更新</b>。<br>需要升级时，到 GitHub 仓库 <code>lq-wq/nestledger</code> 下载最新的 <code>web/index.html</code> 覆盖本文件即可，业务数据不受影响。</div></div>';
  }else if(!upd.enabled&&upd.checked){
    notice='<div class="notice"><div>本部署方式由<b>容器镜像</b>管理版本：GitHub 上 Actions 构建发布新镜像后，在飞牛 Compose 里点「拉取 / 更新」，或用 <code>docker-compose.autoupdate.yml</code> 的 Watchtower 自动完成。<br>当前网页端自动更新已关闭，避免与镜像版本冲突；业务数据不受影响。</div></div>';
  }else if(upd.applying){
    notice='<div class="notice"><div><b>正在下载并校验更新包…</b><br>更新前会自动生成一次数据快照，请勿关闭容器电源。</div></div>';
  }else if(upd.checking){
    notice='<div class="notice"><div><b>正在检查更新…</b></div></div>';
  }else if(upd.hasUpdate&&upd.latest){
    notice='<div class="notice"><div><b>发现新版本 v'+esc(upd.latest.version)+'</b>'+
      (upd.latest.builtAt?' <span class="sub-txt">（发布于 '+esc(updFmt(upd.latest.builtAt))+'）</span>':'')+
      '<br>'+esc(upd.latest.notes||'')+'</div></div>';
  }else if(upd.lastError){
    notice='<div class="notice danger"><div><b>更新检查未成功</b><br>'+esc(upd.lastError)+'<br>业务功能不受影响；可稍后重试，或在服务端配置 <code>UPDATE_MANIFEST_URL</code> 指定可达的更新源。</div></div>';
  }else if(upd.checked){
    notice='<div class="sub-txt" style="margin-top:14px">✓ 已是最新版本。</div>';
  }
  var cfg='';
  if(upd.mode==='server'&&upd.enabled){
    cfg='<div class="hr"></div><div class="upd-actions">'+
      '<span class="sub-txt" style="margin-right:4px">检测到新版本时自动更新</span>'+
      '<button class="btn btn-sm '+(upd.auto?'btn-primary':'')+'" data-act="upd-config" data-key="auto" data-val="'+(upd.auto?'0':'1')+'">'+(upd.auto?'已开启':'已关闭')+'</button>'+
      '<span class="sub-txt" style="margin-left:10px;margin-right:4px">更新后自动重启容器</span>'+
      '<button class="btn btn-sm '+(upd.autoRestart?'btn-primary':'')+'" data-act="upd-config" data-key="autoRestart" data-val="'+(upd.autoRestart?'0':'1')+'">'+(upd.autoRestart?'已开启':'已关闭')+'</button>'+
      '</div>';
  }
  var extra='';
  if(upd.mode==='server'&&upd.overlay){
    extra='<div class="upd-note">如需回退，可恢复容器内置版本；<code>data/db.json</code> 与自动快照始终保留。<br>'+
      '<button class="link" data-act="upd-rollback">恢复内置版本</button> · <button class="link" data-act="upd-restart">重启容器</button></div>';
  }
  return '<div id="updPanel">'+
    '<div class="upd-hero"><div><div class="upd-name">栖间 · NestLedger</div><div class="upd-desc">房屋租赁与收租台账 · 自托管</div></div>'+
    '<span class="upd-ver">v'+esc(upd.version)+'</span></div>'+
    '<div class="upd-grid">'+rows+'</div>'+notice+cfg+extra+
    '<div class="upd-note">更新包来自 GitHub 仓库 <code>lq-wq/nestledger</code>，由服务端校验 sha256 后写入 <code>data/app</code> 覆盖层；'+
    '更新前自动生成数据快照，失败可一键回退。单文件本地版与 NAS 版共用同一份前端代码。</div>'+
    '</div>';
}
function updFootHTML(){
  var f='<button class="btn" data-act="modal-close">关闭</button>';
  if(upd.mode==='server'&&upd.enabled){
    f+='<button class="btn" data-act="upd-check"'+(upd.checking?' disabled':'')+'>'+(upd.checking?'检查中…':'检查更新')+'</button>';
    if(upd.hasUpdate&&upd.latest) f+='<button class="btn btn-primary" data-act="upd-apply"'+(upd.applying?' disabled':'')+'>更新到 v'+esc(upd.latest.version)+'</button>';
  }
  return f;
}
function aboutDialog(){ showModal('关于与更新',updBodyHTML(),updFootHTML()); }
function updRenderPanel(){ if(document.getElementById('updPanel')) aboutDialog(); }
function initUpdate(){
  mountVerChip();
  if(!updServerMode()){
    upd.mode='local'; upd.version=APP_VERSION; upd.builtin=APP_VERSION;
    upd.checked=true; refreshUpdChip(); return;
  }
  upd.mode='server';
  updStatus().then(function(s){
    if(!s) return;
    if(!s.lastCheck) updCheck(false);
    if(s.lastApplied&&s.lastApplied.version===s.current&&(Date.now()-new Date(s.lastApplied.at).getTime()<86400000)){
      var key='nestledger_updated_'+s.lastApplied.version;
      try{ if(!sessionStorage.getItem(key)){ sessionStorage.setItem(key,'1'); toast('已更新到 v'+s.current,'ok'); } }catch(e){}
    }
  });
  if(window.setInterval) setInterval(function(){
    if(document.visibilityState!=='hidden') updStatus();
  },1800000);
}

/* ---------------- 启动 ---------------- */
document.title = APP_NAME+' · '+APP_NAME_EN+' · 房屋租赁台账';
applyTheme(readTheme());
initUpdate();
fillDateChip();
db=load();
